<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso | HOTEL LA PARADA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/gestion/style.css" rel="stylesheet"></head><body class="login-body"><form method="post" class="login-card">{% csrf_token %}<div class="brand-icon mx-auto mb-3">LP</div><h3>HOTEL LA PARADA</h3><p>Acceso al sistema administrativo</p>{% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}<div class="mb-3"><label class="form-label">Usuario</label>{{ form.username }}</div><div class="mb-3"><label class="form-label">Contraseña</label>{{ form.password }}</div><button class="btn btn-primary w-100">Iniciar sesión</button></form></body></html>
